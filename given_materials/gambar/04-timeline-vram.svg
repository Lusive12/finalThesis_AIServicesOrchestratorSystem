<text x="60.0" y="82.0" font-size="12" text-anchor="start" font-weight="400" fill="#5b6470">Ilustrasi konsep, bukan hasil ukur. Asumsi: STT 1,5 GB · LLM 3,3 GB · TTS 3,0 GB; pengguna berbicara selama 3 detik.</text>
